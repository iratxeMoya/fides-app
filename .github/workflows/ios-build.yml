name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node dependencies
      run: npm install --legacy-peer-deps

    - name: Generate iOS native project
      run: npx expo prebuild --platform ios --no-install

    - name: Install CocoaPods
      run: |
        cd ios
        pod install
        cd ..

    - name: Detect workspace and scheme
      id: detect
      run: |
        WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
        SCHEME=$(basename "$WORKSPACE" .xcworkspace)
        echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
        echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

    - name: Build unsigned .app
      run: |
        xcodebuild \
          -workspace "${{ steps.detect.outputs.workspace }}" \
          -scheme "${{ steps.detect.outputs.scheme }}" \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    - name: Package as .ipa
      run: |
        APP=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -1)
        mkdir -p Payload
        cp -R "$APP" Payload/
        zip -r fides.ipa Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: fides-ios
        path: fides.ipa
